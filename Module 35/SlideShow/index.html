<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 35</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slideWrapper">
        <div class="slide">
            <img src="images/nature1.jpg" alt="Image 1">
        </div>
        <div class="slide">
            <img src="images/nature2.jpg" alt="Image 2">
        </div>
        <div class="slide">
            <img src="images/nature3.jpg" alt="Image 3">
        </div>

    </div>

    <a class="prev"><img src="images/back.png" style="width: 50px; height: 50px;"  onclick="plusSlides(-1)"></a>
    <a class="next"><img src="images/forward.png" style="width: 50px; height: 50px;" onclick="plusSlides(1)"></a>

    <script type="text/javascript" src="main.js"></script>
    
</body>
</html>
